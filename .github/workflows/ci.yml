# SPDX-License-Identifier: GPL-3.0-or-later
# Build and test on every push and pull request; a tag vX.Y.Z also builds
# release artifacts, which wait for approval (the "release" environment)
# and are attached to a draft release for the maintainer to publish. A tag
# windows-vX.Y.Z (the Windows beta line, windows/VERSION) attaches the
# Windows packages to a draft pre-release for the maintainer to publish; a
# pre-release never becomes the "latest" release the macOS updater reads.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*", "windows-v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: No build artifacts tracked
        run: |
          if git ls-files | grep -E '^(build|build-[^/]+|dist)/|\.DS_Store$|\.(pkg|zip)$'; then
            echo "::error::build outputs are tracked"; exit 1
          fi
      - name: Property lists
        run: |
          for f in Info.plist.in src/airplay-ble-discovery-Info.plist.in; do
            sed 's/@[A-Z_]*@/x/g' "$f" | plutil -lint -
          done
      - name: The version is set only in CMakeLists.txt
        run: |
          grep -q '@PROJECT_VERSION@' Info.plist.in
          grep -q '@PROJECT_VERSION@' src/airplay-ble-discovery-Info.plist.in
          if grep -nE '<string>[0-9]+\.[0-9]+\.[0-9]+</string>' Info.plist.in src/*.plist.in; then
            echo "::error::hard-coded version in a plist template"; exit 1
          fi
      - name: Shell scripts
        run: |
          brew install shellcheck
          shellcheck -S error build.sh scripts/*.sh tests/*.sh diagnose.sh

  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple silicon
            arch: arm64
          - runner: macos-15-intel   # Intel (macos-13 is retired)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Submodule URL from .gitmodules
        run: git submodule sync --recursive && git submodule update --init --recursive
      - name: Dependencies
        run: |
          brew install cmake pkg-config ffmpeg libplist openssl@3
          brew install --cask obs
      - name: Configure
        run: cmake --preset release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
      - name: Build
        run: cmake --build --preset release -j4
      - name: Test
        env:
          OBS_AIRPLAY_TIMING_SCALE: "3"   # shared runners are slower and noisier
        run: ctest --preset release -j2

  sanitizers:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          brew install cmake pkg-config ffmpeg libplist openssl@3
          brew install --cask obs
      - name: AddressSanitizer + UBSan
        env:
          OBS_AIRPLAY_TIMING_SCALE: "5"   # sanitizers add to that
        run: |
          cmake --preset asan
          cmake --build --preset asan -j4
          ctest --preset asan -j2 -R 'protocol|media-'

  # Windows x64 (docs/WINDOWS_PORT_SCOPE.md): MinGW-w64 (MSYS2 UCRT64)
  # builds the release configuration (FFmpeg, libcrypto and libplist linked
  # into the DLL, scripts/build-windows-release-deps.sh) against obs.dll
  # from the OBS Studio release the vendored headers match, and runs the
  # tests that do not need macOS. Not part of any release.
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    env:
      OBS_WINDOWS_VERSION: "32.0.4"   # obs-headers/PROVENANCE.md
      OBS_WINDOWS_SHA256: fd367a7f156319426f1a600720c1288ad0011da168dff41e0f94dbb18cc1dc0f
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          # ffmpeg: only its command line tool, which makes the test media
          install: >-
            git
            make
            perl
            patch
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-python
      - name: UxPlay changes for Windows (to be moved into the fork)
        run: |
          for patch in windows/uxplay-patches/*.patch; do
            echo "applying $patch"
            git -C uxplay apply --verbose "../$patch"
          done
      - name: Paths
        run: |
          temp="$(cygpath -m "$RUNNER_TEMP")"
          echo "DEPS=$temp/obs-airplay-deps" >> "$GITHUB_ENV"
          echo "TEMP_M=$temp" >> "$GITHUB_ENV"
      # Restore and save separately: saved as soon as it is built, even if a
      # later step fails.
      - name: Release dependencies (cached by the script's content)
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/obs-airplay-deps
          key: windows-release-deps-${{ hashFiles('scripts/build-windows-release-deps.sh') }}
      - name: Build release dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: OBS_AIRPLAY_DEPS_PREFIX="$DEPS" scripts/build-windows-release-deps.sh
      - name: Save release dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/obs-airplay-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Bonjour SDK files (dns_sd.h and an import library)
        run: scripts/windows-bonjour-sdk.sh "$TEMP_M/bonjour-sdk"
      - name: OBS Studio release (obs.dll to link against)
        id: obs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/obs-studio
          key: obs-windows-${{ env.OBS_WINDOWS_VERSION }}
      - name: Download OBS Studio
        if: steps.obs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TEMP_M/obs-studio"
          cd "$TEMP_M/obs-studio"
          curl -L --fail --retry 3 -o obs.zip \
            "https://github.com/obsproject/obs-studio/releases/download/${OBS_WINDOWS_VERSION}/OBS-Studio-${OBS_WINDOWS_VERSION}-Windows-x64.zip"
          echo "${OBS_WINDOWS_SHA256}  obs.zip" | sha256sum -c -
          unzip -q -o obs.zip 'bin/64bit/*' && rm obs.zip
      - name: Configure
        run: |
          # Only the release dependencies: MSYS2's shell also sets
          # PKG_CONFIG_PATH (searched first) to its own FFmpeg.
          BONJOUR_SDK_HOME="$TEMP_M/bonjour-sdk" \
            PKG_CONFIG_PATH="$DEPS/lib/pkgconfig" PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig" \
            cmake -S . -B build-windows -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DOBS_AIRPLAY_STATIC_DEPS=ON -DOPENSSL_ROOT_DIR="$DEPS" \
            -DOBS_LIBOBS="$TEMP_M/obs-studio/bin/64bit/obs.dll"
      - name: Build
        run: cmake --build build-windows -j4
      - name: Plugin DLL imports and exports
        run: |
          objdump -p build-windows/obs-airplay.dll | grep -E 'DLL Name|^\s+\[ *[0-9]+\]' | tee build-windows/dll-report.txt
          # Only Windows itself and OBS: no MinGW, FFmpeg or OpenSSL DLLs.
          if grep 'DLL Name' build-windows/dll-report.txt | grep -viE \
              ' (obs|kernel32|user32|advapi32|ole32|ws2_32|bcrypt|crypt32|ncrypt|secur32|ntdll|avrt|winhttp|shell32|api-ms-win-crt-[a-z0-9-]+)\.dll$'; then
            echo "::error::obs-airplay.dll depends on a DLL OBS does not provide"; exit 1
          fi
      - name: Test
        env:
          OBS_AIRPLAY_TIMING_SCALE: "3"
        run: ctest --test-dir build-windows --output-on-failure -j2
      - name: diagnose.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/diagnose.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Package (zip, installer, symbols)
        env:
          OBS_AIRPLAY_BUILD_DIR: build-windows
          OBS_AIRPLAY_DIST_DIR: dist
          # on a tag, the package must carry the tagged version
          OBS_AIRPLAY_RELEASE_TAG: ${{ (startsWith(github.ref, 'refs/tags/windows-v') || (startsWith(github.ref, 'refs/tags/v') && vars.OBS_AIRPLAY_RELEASE_WINDOWS == 'true')) && github.ref_name || '' }}
        run: scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: obs-airplay-windows-x64
          path: dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obs-airplay-windows-x64-test-logs
          path: |
            build-windows/dll-report.txt
            build-windows/Testing/Temporary/LastTest.log
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build-test, sanitizers]
    runs-on: macos-14
    environment: release   # requires a maintainer's approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          brew install cmake pkg-config libplist openssl@3
          brew install --cask obs
      - name: Release dependencies (cached by the script's content)
        id: deps
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/obs-airplay-release-deps
          key: release-deps-arm64-${{ hashFiles('scripts/build-macos-release-deps.sh') }}
      - name: Build release dependencies
        run: scripts/build-macos-release-deps.sh
      - name: Package
        env:
          OBS_AIRPLAY_RELEASE_TAG: ${{ github.ref_name }}
          OBS_AIRPLAY_DEPS_PREFIX: /Users/runner/Library/Caches/obs-airplay-release-deps/arm64-macos12.0
          OBS_AIRPLAY_BUILD_DIR: /Users/runner/obs-airplay-release-build
          OBS_AIRPLAY_DIST_DIR: /Users/runner/obs-airplay-dist
        run: scripts/package-macos.sh
      - name: Sign the zip for the self-updater (only with the key as a secret)
        env:
          SIGNING_KEY: ${{ secrets.OBS_AIRPLAY_SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          OBS_AIRPLAY_SIGNING_KEY="$RUNNER_TEMP/key.pem" \
            OBS_AIRPLAY_OPENSSL="$(brew --prefix openssl@3)/bin/openssl" \
            scripts/sign-release.sh /Users/runner/obs-airplay-dist/obs-airplay-${{ github.ref_name }}-macos-arm64.zip
          rm -f "$RUNNER_TEMP/key.pem"
      - name: Checksums
        run: cd /Users/runner/obs-airplay-dist && shasum -a 256 * > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published by hand (scripts/package-macos.sh locally)
          # is left alone.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} exists; not drafting another"
            exit 0
          fi
          notes="docs/releases/RELEASE_NOTES_${{ github.ref_name }}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "${{ github.ref_name }}" --draft --verify-tag \
            --title "OBS AirPlay ${{ github.ref_name }}" --notes-file "$notes" \
            /Users/runner/obs-airplay-dist/*

  # The Windows packages the windows job built and tested, added to the draft
  # release the macOS job made. Waits for the same approval. Off until the
  # repository variable OBS_AIRPLAY_RELEASE_WINDOWS is "true" (docs/WINDOWS.md).
  release-windows:
    if: startsWith(github.ref, 'refs/tags/v') && vars.OBS_AIRPLAY_RELEASE_WINDOWS == 'true'
    needs: [windows, release]
    runs-on: ubuntu-latest
    environment: release   # requires a maintainer's approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4   # scripts/sign-release.sh, src/update-trusted-keys.h
      - uses: actions/download-artifact@v4
        with:
          name: obs-airplay-windows-x64
          path: dist
      - name: Sign the installer for the self-updater (only with the key as a secret)
        env:
          SIGNING_KEY: ${{ secrets.OBS_AIRPLAY_SIGNING_KEY }}
        if: env.SIGNING_KEY != ''
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          for setup in dist/*-windows-x64-setup.exe; do
            OBS_AIRPLAY_SIGNING_KEY="$RUNNER_TEMP/key.pem" OBS_AIRPLAY_OPENSSL="$(command -v openssl)" \
              scripts/sign-release.sh "$setup"
          done
          rm -f "$RUNNER_TEMP/key.pem"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS-windows
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Only a draft is changed; a release published by hand is left alone.
          draft="$(gh release view "${{ github.ref_name }}" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "release ${{ github.ref_name }} is not a draft; not attaching Windows files"
            exit 0
          fi
          gh release upload "${{ github.ref_name }}" dist/*

  # The Windows beta's draft pre-release. On a branch push it creates or
  # refreshes the draft for windows/VERSION (when its release notes exist and
  # no release of that version is published); the maintainer publishes it,
  # which creates the windows-vX.Y.Z tag. On such a tag pushed by hand, it
  # creates the draft, or fills an empty pre-release made on GitHub.
  windows-beta-draft:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/windows-v') || startsWith(github.ref, 'refs/heads/'))
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-beta-draft
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4   # windows/VERSION, the release notes
      - uses: actions/download-artifact@v4
        with:
          name: obs-airplay-windows-x64
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS-windows && cat SHA256SUMS-windows
      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="windows-v$(sed -nE '1s/^([0-9]+\.[0-9]+\.[0-9]+)\r?$/\1/p' windows/VERSION)"
          fi
          notes="docs/releases/RELEASE_NOTES_${tag}.md"
          title="OBS AirPlay for Windows ${tag#windows-v} (beta)"
          if [ ! -f "$notes" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::$notes is missing"; exit 1; fi
            echo "no $notes: no draft for $tag"; exit 0
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              gh release create "$tag" dist/* --verify-tag --draft --prerelease --latest=false \
                --title "$title" --notes-file "$notes"
            elif [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "$tag is already tagged without a release; not drafting"
            else
              gh release create "$tag" dist/* --draft --prerelease --latest=false \
                --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
              echo "::notice::draft $tag from $GITHUB_REF_NAME at $GITHUB_SHA"
            fi
            exit 0
          fi

          info="$(gh release view "$tag" --json isDraft,isPrerelease,assets,body \
            --jq '"\(.isDraft) \(.isPrerelease) \(.assets | length) \(.body | length)"')"
          read -r draft prerelease assets body <<<"$info"
          if [ "$draft" = true ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            # Still a draft: it follows the branch's latest build.
            gh release edit "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
            gh release upload "$tag" dist/* --clobber
            echo "::notice::draft $tag refreshed from $GITHUB_REF_NAME at $GITHUB_SHA"
          elif [ "$GITHUB_REF_TYPE" = tag ] && [ "$prerelease" = true ] && [ "$assets" = 0 ]; then
            # Made on GitHub with the tag: fill it.
            gh release upload "$tag" dist/*
            if [ "$body" = 0 ]; then gh release edit "$tag" --notes-file "$notes"; fi
          else
            echo "release $tag is published with its files; nothing changed"
          fi
