AirPlay="AirPlay"
AirPlay.Description="Receive AirPlay streams from iOS and macOS devices"
AirPlay.ServerName="Server Name"
AirPlay.ServerNameTooltip="<p>The name devices show for this receiver. Give each Mac its own.</p>"
AirPlay.ResetServerName="Reset to Default"
AirPlay.Info="The receiver runs while OBS is open and appears on your devices under the server name above, in Screen Mirroring and in the AirPlay menu of apps. This source shows what a device sends. All AirPlay sources share these settings."
AirPlay.Status="Status: %s (port %d)"
AirPlay.Status.NotRunning="Status: Not running"
AirPlay.Status.SeeLog="See the OBS log for details."
AirPlay.Status.Refused="Last refused AirPlay video at %s"
AirPlay.State.Waiting="Waiting for a device"
AirPlay.State.Connected="Device connected"
AirPlay.State.Mirroring="Screen mirroring"
AirPlay.State.Video="Playing AirPlay video"
AirPlay.Error.SetupFailed="The AirPlay receiver could not be set up (see the OBS log)."
AirPlay.Error.PortsBusy="Ports 7000 and 7001 are both in use, so devices cannot connect. macOS's own AirPlay Receiver uses port 7000: turn it off in System Settings > General > AirDrop & Handoff, or quit the app using the ports, then restart OBS."
AirPlay.Error.PortBusy="Port %d is in use, so devices cannot connect. Quit the app using it, then restart OBS."
AirPlay.Error.Bonjour="Running, but devices may not find it: Bonjour registration failed (error %d). Check that the name is unique on the network."
AirPlay.Error.NameTooLong="The name is longer than %d bytes, the most AirPlay devices can show; still advertising \"%s\"."
AirPlay.FollowSenderClock="Keep AirPlay video in step with the sending app"
AirPlay.FollowSenderClock.Tooltip="<p>For apps that also play the video on the device (such as Shelf). Leave off for Safari.</p>"
AirPlay.Video="AirPlay video"
