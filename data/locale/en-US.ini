AirPlay="AirPlay"
AirPlay.Description="Receive AirPlay streams from iOS and macOS devices"
AirPlay.ServerName="Server Name"
AirPlay.ServerNameTooltip="<p>The name devices show in Screen Mirroring and in the AirPlay menu.</p><p>Give each Mac a different name if several run the plugin. Shared by all AirPlay sources.</p>"
AirPlay.ResetServerName="Reset to Default"
AirPlay.Info="The receiver runs while OBS is open and appears on your devices under the server name above, in Screen Mirroring and in the AirPlay menu of apps. This source shows what a device sends. All AirPlay sources share these settings."
AirPlay.Status="Status: %s (port %d)"
AirPlay.Status.NotRunning="Status: Not running"
AirPlay.Status.SeeLog="See the OBS log for details."
AirPlay.Status.Refused="Last refused AirPlay video at %s"
AirPlay.State.Waiting="Waiting for a device"
AirPlay.State.Connected="Device connected"
AirPlay.State.Mirroring="Screen mirroring"
AirPlay.State.Video="Playing AirPlay video"
AirPlay.Error.SetupFailed="The AirPlay receiver could not be set up (see the OBS log)."
AirPlay.Error.PortsBusy="Ports 7000 and 7001 are both in use, so devices cannot connect. macOS's own AirPlay Receiver uses port 7000: turn it off in System Settings > General > AirDrop & Handoff, or quit the app using the ports, then restart OBS."
AirPlay.Error.PortBusy="Port %d is in use, so devices cannot connect. Quit the app using it, then restart OBS."
AirPlay.Error.Bonjour="Running, but devices may not find it: Bonjour registration failed (error %d). Check that the name is unique on the network."
AirPlay.Error.NameTooLong="The name is longer than %d bytes, the most AirPlay devices can show; still advertising \"%s\"."
AirPlay.FollowSenderClock="Keep AirPlay video in step with the sending app"
AirPlay.FollowSenderClock.Tooltip="<p>For apps that also play the video on the device, such as Shelf.</p><p>The video starts where the app has got to when OBS shows its first picture, so OBS does not run behind the device.</p><p>Leave off for Safari and apps that wait for the receiver.</p>"
AirPlay.Video="AirPlay video"
AirPlay.Video.Anywhere="From any web address"
AirPlay.Video.SenderOnly="Only from the sending device"
AirPlay.Video.Off="Off (screen mirroring only)"
AirPlay.Video.Tooltip="<p>With AirPlay video (the AirPlay button in Safari, YouTube and other apps), the device sends a web address and this Mac downloads the video itself. Screen mirroring is not affected by this setting.</p><p><b>From any web address:</b> videos from websites play, as on an Apple TV.</p><p><b>Only from the sending device:</b> only videos the device serves itself play (its own files, videos in the page). Links to websites are refused.</p><p><b>Off:</b> every AirPlay video is refused; the device plays it itself or shows an error.</p>"
AirPlay.AllowSelfSigned="Allow self-signed media servers"
AirPlay.AllowSelfSigned.Tooltip="<p>AirPlay video from an HTTPS server whose certificate cannot be verified (self-signed, or from a private certificate authority) is refused unless this is on.</p><p>Only turn it on for your own media server: it lets anyone on the network between OBS and that server see or change the video.</p>"
AirPlay.LatencyTelemetry="Log latency telemetry"
AirPlay.LatencyTelemetry.Tooltip="<p>Writes [latency] lines to the OBS log: decode and output times, every 120 video and 240 audio frames.</p><p>For diagnosing stutter; leave off otherwise.</p>"
AirPlay.CheckForUpdates="Check for plugin updates once a day"
AirPlay.CheckForUpdates.Tooltip="<p>Asks GitHub once a day whether a newer OBS AirPlay is available.</p><p>You are asked first (never while streaming or recording), and nothing is installed unless you choose Install Update.</p><p>Turn off to make no update requests at all.</p>"
AirPlay.Version="OBS AirPlay Plugin v%s"
